{% comment %}
  CityPlay venue design tokens — included by both venue pages.
  Safe to move into base.html if you want it site-wide.
{% endcomment %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root{
    --cp-bg:#F6F5F0;
    --cp-surface:#FFFFFF;
    --cp-line:#E5E5E5;
    --cp-ink:#14201C;
    --cp-ink-2:#5B6763;
    --cp-ink-3:#8B9591;
    --cp-teal:#1A7A6E;
    --cp-teal-dark:#145F56;
    --cp-teal-soft:#E7F2F0;
    --cp-coral:#E85C3A;
    --cp-coral-soft:#FDEDE8;
    --cp-r:12px;
    --cp-shadow:0 1px 2px rgba(20,32,28,.04), 0 4px 14px -6px rgba(20,32,28,.10);
    --cp-shadow-lg:0 10px 30px -12px rgba(20,32,28,.22);
    --cp-s:4px; /* base unit */
  }

  .cp-page{background:var(--cp-bg);color:var(--cp-ink);font-family:"Inter",system-ui,sans-serif;}
  .cp-display{font-family:"Barlow Condensed","Inter",sans-serif;text-transform:uppercase;letter-spacing:.005em;line-height:.95;font-weight:800;}
  .cp-sec{margin-top:48px;}

  .cp-card{background:var(--cp-surface);border:1px solid var(--cp-line);border-radius:var(--cp-r);box-shadow:var(--cp-shadow);}
  .cp-venue-card{overflow:hidden;transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease,border-color .22s ease;}
  .cp-venue-card:hover{transform:translateY(-4px);box-shadow:var(--cp-shadow-lg);border-color:#D7DAD8;}
  .cp-venue-card:hover .cp-book{opacity:1;transform:translateY(0);}
  .cp-venue-card:hover .cp-photo img{transform:scale(1.06);}
  .cp-photo img{transition:transform .5s cubic-bezier(.22,1,.36,1);}
  .cp-book{opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;}
  @media (hover:none){.cp-book{opacity:1;transform:none;}}

  .cp-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
    background:#fff;color:var(--cp-ink-2);border:1px solid var(--cp-line);transition:all .18s ease;white-space:nowrap;}
  .cp-pill:hover{border-color:var(--cp-teal);color:var(--cp-teal);}
  .cp-pill--on{background:var(--cp-teal);border-color:var(--cp-teal);color:#fff;}
  .cp-pill--on:hover{color:#fff;background:var(--cp-teal-dark);border-color:var(--cp-teal-dark);}

  .cp-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;
    background:var(--cp-teal-soft);color:var(--cp-teal-dark);}
  .cp-price{color:var(--cp-coral);font-weight:700;}

  .cp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:8px;
    font-weight:600;font-size:15px;background:var(--cp-teal);color:#fff;transition:background .18s ease,box-shadow .18s ease;}
  .cp-btn:hover{background:var(--cp-teal-dark);box-shadow:0 8px 20px -10px rgba(26,122,110,.9);}
  .cp-btn--sm{height:38px;font-size:13px;padding:0 14px;border-radius:8px;}
  .cp-link{color:var(--cp-teal-dark);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;}
  .cp-link:hover{color:var(--cp-coral);}

  .cp-sticky-bar{position:sticky;top:0;z-index:40;background:rgba(246,245,240,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--cp-line);}
  .cp-scroll-x{overflow-x:auto;scrollbar-width:none;}
  .cp-scroll-x::-webkit-scrollbar{display:none;}

  .cp-ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
  .cp-ico-lg{width:20px;height:20px;}

  :where(a,button,input,select):focus-visible{outline:2px solid var(--cp-teal);outline-offset:2px;border-radius:8px;}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important;}}
</style>
